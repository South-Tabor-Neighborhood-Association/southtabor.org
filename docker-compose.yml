version: '3.8'

services:
  db:
    # MariaDB, as on Hostinger shared hosting
    image: mariadb:11.8
    container_name: southtabor_db
    restart: always
    environment:
      MARIADB_DATABASE: southtabor_dreamhosters_
      MARIADB_USER: southtabordreamh
      MARIADB_PASSWORD: your_dev_password
      MARIADB_ROOT_PASSWORD: your_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data_mariadb:/var/lib/mysql
      # Automatically import the database backup when the container is first created.
      # Make sure db_backup.sql is in the southtabor.org/ folder before starting the container.
      - ./southtabor.org/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql
    networks:
      default:
        aliases:
          - mysql.southtabor.dreamhosters.com

  wordpress:
    build: ./docker/wordpress
    image: southtabor-wordpress:php8.5
    container_name: southtabor_wp
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./southtabor.org:/var/www/html
    depends_on:
      - db

volumes:
  db_data_mariadb:
