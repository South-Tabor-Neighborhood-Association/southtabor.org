version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: southtabor_db
    restart: always
    environment:
      MYSQL_DATABASE: southtabor_dreamhosters_
      MYSQL_USER: southtabordreamh
      MYSQL_PASSWORD: your_dev_password
      MYSQL_ROOT_PASSWORD: your_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically import the database backup when the container is first created.
      # Make sure db_backup.sql is in the southtabor.org/ folder before starting the container.
      - ./southtabor.org/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql
    networks:
      default:
        aliases:
          - mysql.southtabor.dreamhosters.com

  wordpress:
    image: wordpress:php7.4-apache
    container_name: southtabor_wp
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./southtabor.org:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
